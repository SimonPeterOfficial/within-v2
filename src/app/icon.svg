<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="sweep" x1="10" y1="6" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="#050505"/>
  <!-- The aperture ring — open at 45° -->
  <circle cx="32" cy="32" r="19" fill="none" stroke="url(#sweep)" stroke-width="5" stroke-linecap="round" stroke-dasharray="104 15" stroke-dashoffset="-7" transform="rotate(-45 32 32)"/>
  <!-- The light within -->
  <circle cx="32" cy="32" r="10.5" fill="url(#core)"/>
  <circle cx="32" cy="32" r="4.5" fill="#ffffff" opacity="0.92"/>
  <!-- The spark on the aperture -->
  <circle cx="45.5" cy="17.5" r="2.6" fill="#34d399"/>
</svg>
