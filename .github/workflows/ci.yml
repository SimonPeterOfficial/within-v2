name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  # Force deterministic builds. DATABASE_URL is intentionally not set here —
  # the build does not require a database connection. Integration tests that
  # need a database run separately in a test environment.
  DATABASE_URL: ""

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Run automated tests
        run: npx tsx --test src/lib/__tests__/content-visibility.test.ts
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
